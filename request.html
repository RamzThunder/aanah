<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7faff" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <title>요청 보내기 · 아나!</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root{--navy:#193f7c;--ink:#203a60;--muted:#74849e;--blue:#4c91eb;--pale:#f6faff;--line:#e0eaf4;--red:#c8423b}
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:var(--pale);color:var(--ink);font-family:Pretendard,ui-sans-serif,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.03em;word-break:keep-all}
    button,input,select,textarea{font:inherit;color:inherit}
    a{color:var(--blue)}
    :focus-visible{outline:3px solid #80b4ff;outline-offset:2px}
    main{max-width:620px;margin:0 auto;padding:40px 20px 60px}
    .home{display:inline-flex;gap:8px;align-items:center;font-weight:800;color:var(--navy);text-decoration:none}
    .home img{width:30px;height:28px}
    h1{font-size:30px;margin:26px 0 8px;color:var(--navy);letter-spacing:-.06em}
    .lead{margin:0 0 26px;color:var(--muted);line-height:1.6}
    form{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 12px 36px rgba(33,79,138,.07);display:grid;gap:20px}
    fieldset{border:0;margin:0;padding:0}
    legend,label>span{display:block;font-weight:800;font-size:15px;margin-bottom:8px}
    label small,legend small{font-weight:600;color:var(--muted);margin-left:4px}
    .kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .kinds label{position:relative}
    .kinds input{position:absolute;opacity:0;inset:0}
    .kinds span{display:block;margin:0;padding:12px 6px;text-align:center;border:1.5px solid var(--line);border-radius:14px;font-weight:700;cursor:pointer;background:#fbfdff}
    .kinds input:checked+span{border-color:var(--blue);background:#eaf3ff;color:var(--navy)}
    .kinds input:focus-visible+span{outline:3px solid #80b4ff;outline-offset:2px}
    input[type=text],input[type=url],select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff}
    textarea{min-height:150px;resize:vertical;line-height:1.55}
    textarea.short{min-height:76px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .song-head,.song-row{display:grid;grid-template-columns:1fr 1.2fr 1.4fr 36px;gap:8px;align-items:center}
    .song-head{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .song-head small{font-weight:600}
    .song-row{margin-bottom:8px}
    .song-row input{min-width:0}
    .remove-song{width:36px;height:36px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);font-size:18px;cursor:pointer}
    .remove-song:hover{color:var(--red);border-color:#f0c4c1}
    .add-song{margin-top:4px;padding:10px 14px;border:1.5px dashed #bcd3ee;border-radius:12px;background:#f5f9ff;color:var(--navy);font-weight:700;cursor:pointer;width:100%}
    .add-song:disabled{opacity:.5;cursor:not-allowed}
    .hint{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
    .trap{position:absolute;left:-9999px}
    button[type=submit]{padding:15px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
    button[type=submit]:disabled{opacity:.55;cursor:wait}
    #error{margin:0;color:var(--red);font-weight:700;min-height:1em}
    .notice{background:#fff8e6;border:1px solid #f1dfa9;border-radius:14px;padding:14px 16px;line-height:1.6;margin-bottom:18px}
    .done-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(246,250,255,.82);backdrop-filter:blur(6px)}
    .done{width:min(440px,100%);background:#fff;border:2px solid #9fd3b4;border-radius:22px;padding:40px 26px;text-align:center;box-shadow:0 12px 36px rgba(35,119,74,.12)}
    .done-mark{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:#e8f7ee;color:#23774a;display:grid;place-items:center;font-size:28px;font-weight:900}
    .done h2{color:var(--navy);margin:0 0 10px;outline:none}
    .done p{color:var(--muted);margin:0 0 22px;line-height:1.6}
    .done button{padding:11px 18px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
    @media (max-width:520px){.kinds{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}form{padding:20px}
      .song-head{display:none}.song-row{grid-template-columns:1fr 1fr 36px;padding-bottom:8px;border-bottom:1px solid var(--line)}.song-row input[data-field=link]{grid-column:1/3}}
  </style>
</head>
<body>
<main>
  <a class="home" href="/"><img src="assets/icon-512.png" alt="">아나!</a>
  <h1>요청 보내기</h1>
  <p class="lead">쓰다가 불편한 점, 오류, 아이디어, 전주 퀴즈에 넣고 싶은 노래를 보내 주세요.<br>보내 주신 내용은 아나! 관리자에게만 전달돼요.</p>
  <div id="notice" class="notice" hidden></div>

  <form id="form" novalidate autocomplete="off">
    <fieldset>
      <legend>어떤 요청인가요?</legend>
      <div class="kinds">
        <label><input type="radio" name="kind" value="bug"><span>🐞 오류 신고</span></label>
        <label><input type="radio" name="kind" value="idea" checked><span>💡 기능 제안</span></label>
        <label><input type="radio" name="kind" value="song"><span>🎵 곡 신청</span></label>
        <label><input type="radio" name="kind" value="etc"><span>💬 기타</span></label>
      </div>
    </fieldset>

    <label id="toolField"><span>어느 도구 관련인가요?</span><select name="tool" id="tool"></select></label>

    <fieldset id="songFields" hidden>
      <legend>신청할 곡 <small id="songCount"></small></legend>
      <div class="song-head" aria-hidden="true"><span>가수</span><span>노래 제목</span><span>유튜브 링크 <small>선택</small></span><span></span></div>
      <div id="songRows"></div>
      <button type="button" class="add-song" id="addSong">+ 곡 더 추가</button>
      <p class="hint">한 번에 20곡까지 보낼 수 있어요. 전주 듣고 노래 맞히기 기본 문제은행에 넣어 드려요.</p>
    </fieldset>
    <template id="songRow"><div class="song-row">
      <input type="text" data-field="artist" maxlength="100" autocomplete="off" placeholder="가수">
      <input type="text" data-field="song" maxlength="100" autocomplete="off" placeholder="노래 제목">
      <input type="url" data-field="link" maxlength="300" placeholder="https://youtu.be/...">
      <button type="button" class="remove-song">×</button>
    </div></template>

    <label id="titleField"><span>제목 <small>선택</small></span><input type="text" name="title" maxlength="200" autocomplete="off"></label>
    <label><span id="bodyLabel">내용</span><textarea name="body" maxlength="2000"></textarea>
      <p class="hint" id="bodyHint">오류라면 어떤 화면에서 무엇을 눌렀는지 적어 주시면 빨리 고칠 수 있어요.</p></label>
    <label><span>보내는 분 <small>선택 · 답장이 필요하면 학교·이름이나 연락처</small></span><input type="text" name="contact" maxlength="100" autocomplete="off"></label>
    <input class="trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="turnstile"></div>
    <p id="error" role="alert"></p>
    <button type="submit" id="submit">보내기</button>
  </form>

  <div class="done-overlay" id="done" hidden>
    <section class="done" role="alertdialog" aria-modal="true" aria-labelledby="doneTitle" aria-describedby="doneText">
      <div class="done-mark" aria-hidden="true">✓</div>
      <h2 id="doneTitle" tabindex="-1">보냈어요, 고마워요!</h2>
      <p id="doneText">꼼꼼히 읽어 보고 반영할게요.</p>
      <button type="button" id="again">새로 작성하기</button>
    </section>
  </div>
</main>
<script>
// 도구 이름은 index.html의 apps 목록과 맞춘다. 도구 페이지 링크의 ?tool= 값이 목록에 없으면 맨 아래에 추가한다.
const TOOLS = ['아나! 전체', '전주 듣고 노래 맞히기', '지금 몇교시야', '평가 도구 모음', 'OMR 서술형 채점 도구', '판떼기 PanDeckI', 'BLANKing',
  '글쓰기 채점표', '말하기 채점표', '발표 순서 돌림판', '조 편성 자리판', '검열국을 탈출하라', '디다', '찌라시 스티커 생성기'];
const SONG_TOOL = '전주 듣고 노래 맞히기';
const OLD_FORM = 'https://docs.google.com/forms/d/e/1FAIpQLSf3LzumGBb5t9QskyB-CtbIGP41AC6S4h2uGFizKO3KOKcw4w/viewform';
const MAX_SONGS = 20;
const $ = s => document.querySelector(s), form = $('#form');
const songRows = $('#songRows');
function updateSongRows() {
  const rows = songRows.children;
  [...rows].forEach((row, i) => {
    for (const input of row.querySelectorAll('input')) input.setAttribute('aria-label', `${i + 1}번째 곡 ${input.placeholder}`);
    const remove = row.querySelector('.remove-song');
    remove.setAttribute('aria-label', `${i + 1}번째 곡 지우기`);
    remove.hidden = rows.length === 1;
  });
  $('#addSong').disabled = rows.length >= MAX_SONGS;
  $('#songCount').textContent = rows.length > 1 ? `${rows.length}곡` : '';
}
function addSongRow(focus) {
  if (songRows.children.length >= MAX_SONGS) return;
  songRows.append($('#songRow').content.cloneNode(true));
  updateSongRows();
  if (focus) songRows.lastElementChild.querySelector('input').focus();
}
$('#addSong').onclick = () => addSongRow(true);
songRows.addEventListener('click', e => {
  const remove = e.target.closest('.remove-song');
  if (!remove) return;
  const row = remove.closest('.song-row'), next = row.nextElementSibling || row.previousElementSibling;
  row.remove(); updateSongRows();
  next?.querySelector('input').focus();
});
// 마지막 줄의 링크 칸에서 Enter를 누르면 보내지 않고 새 줄을 만든다.
songRows.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.field === 'link' && e.target.closest('.song-row') === songRows.lastElementChild) {
    e.preventDefault(); addSongRow(true);
  }
});
addSongRow(false);
const songList = () => [...songRows.children].map(row => Object.fromEntries(
  [...row.querySelectorAll('input')].map(input => [input.dataset.field, input.value.trim()])))
  .filter(s => s.artist || s.song || s.link);
const params = new URLSearchParams(location.search);

const toolSelect = $('#tool'), wanted = params.get('tool');
for (const name of wanted && !TOOLS.includes(wanted) ? [...TOOLS, wanted] : TOOLS) toolSelect.add(new Option(name, name));
if (wanted) toolSelect.value = wanted;
if (['bug', 'idea', 'song', 'etc'].includes(params.get('kind'))) form.elements.kind.value = params.get('kind');

function sync() {
  const song = form.elements.kind.value === 'song';
  $('#songFields').hidden = !song;
  $('#toolField').hidden = song;
  $('#titleField').hidden = song;
  $('#bodyLabel').innerHTML = song ? '하고 싶은 말 <small>선택 · 쓰고 싶은 학년, 유행한 구간 등</small>' : '내용';
  $('#bodyHint').hidden = form.elements.kind.value !== 'bug';
  form.elements.body.classList.toggle('short', song);
  form.elements.body.rows = song ? 2 : 6;
}
form.addEventListener('change', e => { if (e.target.name === 'kind') sync(); });
sync();

let turnstileToken = '', widget;
fetch('/api/requests').then(r => r.json()).then(cfg => {
  if (!cfg.ready) {
    $('#notice').hidden = false;
    $('#notice').innerHTML = `요청함을 준비하고 있어요. 그동안은 <a href="${OLD_FORM}" target="_blank" rel="noopener noreferrer">예전 의견 보내기 폼</a>으로 보내 주세요.`;
    $('#submit').disabled = true;
    return;
  }
  if (cfg.turnstile) {
    const s = document.createElement('script');
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?onload=renderTurnstile&render=explicit';
    window.renderTurnstile = () => { widget = turnstile.render('#turnstile', { sitekey: cfg.turnstile, callback: t => { turnstileToken = t; } }); };
    document.head.append(s);
  }
}).catch(() => {});

let sent = false;
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (sent) return;
  const f = form.elements, kind = f.kind.value;
  const data = {
    kind, tool: kind === 'song' ? SONG_TOOL : f.tool.value, title: f.title.value, body: f.body.value,
    songs: kind === 'song' ? songList() : undefined, contact: f.contact.value,
    website: f.website.value, turnstile: turnstileToken,
  };
  const missing = kind === 'song' ? data.songs.findIndex(s => !s.artist || !s.song) : -1;
  if (kind === 'song' ? !data.songs.length || missing >= 0 : !data.body.trim()) {
    $('#error').textContent = kind !== 'song' ? '내용을 적어 주세요.'
      : !data.songs.length ? '가수와 노래 제목을 적어 주세요.'
      : `${data.songs.length > 1 ? `${missing + 1}번째 곡: ` : ''}가수와 노래 제목을 모두 적어 주세요.`;
    return;
  }
  $('#error').textContent = '';
  $('#submit').disabled = true; $('#submit').textContent = '보내는 중…';
  try {
    const res = await fetch('/api/requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
    const out = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(out.error || '보내지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    $('#doneText').textContent = kind === 'song' && data.songs.length > 1 ? `${data.songs.length}곡을 신청했어요. 꼼꼼히 확인하고 반영할게요.` : '꼼꼼히 읽어 보고 반영할게요.';
    // 중복으로 보내지 않도록 입력을 비우고 잠근 뒤 완료 창으로 화면을 덮는다. 더 보내려면 새로고침한다.
    sent = true;
    form.reset(); songRows.replaceChildren(); addSongRow(false);
    for (const el of form.elements) el.disabled = true;
    form.inert = true;
    $('#done').hidden = false;
    $('#again').focus();
  } catch (err) {
    $('#error').textContent = err.message;
  } finally {
    if (!sent) { $('#submit').disabled = false; $('#submit').textContent = '보내기'; }
    if (widget !== undefined) { window.turnstile?.reset(widget); turnstileToken = ''; }
  }
});
$('#again').onclick = () => location.reload();
</script>
</body>
</html>
