<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15162e"><title>전주 듣고 노래 맞히기 · TV 화면</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="style.css"><style>
body{background:var(--preview-dark);color:#fff;min-height:100vh;overflow-x:hidden}.tv-head{display:flex;justify-content:space-between;align-items:center;padding:25px 4%;font-size:17px;color:var(--preview-text)}.tv-head button{background:#ffffff0d;border-color:#ffffff26;color:#fff;font-size:14px}#screen{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px 4%}.tv-record{width:clamp(120px,19vw,240px);height:clamp(120px,19vw,240px);margin:32px auto}.tv-record div{width:34%;height:34%;font-size:50px}#tvTitle{font-size:clamp(36px,5.5vw,84px);letter-spacing:-.055em;line-height:1.25;margin:10px 0 18px;max-width:1200px}#tvSub{font-size:clamp(20px,2.5vw,36px);color:var(--preview-text);margin:0 0 28px}#tvTag{color:var(--highlight);letter-spacing:.15em;font-size:18px}.tv-levels{display:flex;gap:20px;margin-top:15px;color:var(--preview-text);font-size:19px}.tv-levels span{padding:10px 22px;border:1px solid #413955;border-radius:12px}.tv-levels .selected{color:var(--highlight);border-color:var(--highlight);background:color-mix(in srgb,var(--highlight) 5%,transparent)}#videoWrap{width:min(960px,90vw,105dvh);margin:10px auto}#videoWrap iframe{width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:12px;display:block}#videoWrap a{color:var(--highlight);font-size:14px}.tv-foot:empty{display:none}.tv-foot{text-align:center;color:var(--preview-text);font-size:14px;padding:12px}#screen.answer #tvTitle{font-size:clamp(36px,min(5.5vw,9dvh),88px);margin:0 0 6px}#screen.answer #tvSub{font-size:clamp(20px,3.4dvh,34px);margin:0}#screen.answer{padding-top:0;justify-content:flex-start}#screen.answer #tvTag{font-size:14px;margin-bottom:10px}[hidden]{display:none!important}@media(max-width:600px){.tv-levels{font-size:14px;gap:8px}.tv-levels span{padding:10px}.tv-head{font-size:13px;gap:10px}} </style></head><body>
<header class="tv-head"><span id="tvProgress">전주 듣고 노래 맞히기</span><button id="fullscreen">전체 화면</button></header>
<main id="screen"><span id="tvTag">READY TO PLAY</span><div class="record tv-record" id="tvRecord" aria-hidden="true"><div>♪</div></div><h1 id="tvTitle">전주 듣고 노래 맞히기</h1><p id="tvSub">곧 시작합니다.</p><div class="tv-levels" id="tvLevels"><span>상 · 0.5초</span><span>중 · 1초</span><span id="tvEasy">하 · 3초 이상</span></div><div id="videoWrap" hidden><div id="answerPlayer"></div><a id="externalVideo" hidden target="_blank" rel="noopener noreferrer">유튜브에서 열기</a></div></main><footer class="tv-foot" id="tvFooter" role="status"></footer>
<script type="module" src="tv.mjs"></script></body></html>
