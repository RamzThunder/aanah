<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#15162e"><title>전주 듣고 노래 맞히기 · TV 화면</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="style.css"><style>
body{background:var(--preview-dark);color:#fff;min-height:100vh;overflow-x:hidden}.tv-head{display:flex;justify-content:space-between;align-items:center;padding:25px 4%;font-size:17px;color:var(--preview-text)}.tv-head button{background:#ffffff0d;border-color:#ffffff26;color:#fff;font-size:14px}#screen{min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px 4%}.tv-record{width:clamp(120px,19vw,240px);height:clamp(120px,19vw,240px);margin:32px auto}.tv-record div{width:34%;height:34%;font-size:50px}#tvTitle{font-size:clamp(36px,5.5vw,84px);letter-spacing:-.055em;line-height:1.25;margin:10px 0 18px;max-width:1200px}#tvSub{font-size:clamp(20px,2.5vw,36px);color:var(--preview-text);margin:0 0 28px}#tvTag{color:var(--highlight);letter-spacing:.15em;font-size:18px}.tv-levels{display:flex;gap:20px;margin-top:15px;color:var(--preview-text);font-size:19px}.tv-levels span{padding:10px 22px;border:1px solid #413955;border-radius:12px}.tv-levels .selected{color:var(--highlight);border-color:var(--highlight);background:color-mix(in srgb,var(--highlight) 5%,transparent)}#videoWrap{--video-scale:1;width:calc(min(96vw,(83dvh - 150px)*16/9)*var(--video-scale));min-width:min(320px,96vw);margin:10px auto}.tv-tools{display:flex;align-items:center;gap:14px}.tv-size{display:flex;align-items:center;gap:6px;font-size:14px}.tv-size button{width:36px;padding:6px 0;line-height:1}.tv-size output{min-width:46px;text-align:center;color:#fff}#screen.lyrics-on #videoWrap{width:calc(min(96vw,(83dvh - 215px)*16/9)*var(--video-scale))}.video-stage{position:relative;container-type:inline-size}#videoWrap iframe{width:100%;height:auto;aspect-ratio:16/9;border:0;border-radius:12px;display:block}#videoWrap a{color:var(--highlight);font-size:14px}.lyrics{position:absolute;left:0;right:0;bottom:0;padding:7cqw 4% 2.6cqw;background:linear-gradient(transparent,#000000c4 48%);border-radius:0 0 12px 12px;pointer-events:none;text-align:center}.lyric-line{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.3;min-height:1.3em;word-break:keep-all}.lyric-line.now{font-size:clamp(18px,4.4cqw,66px)}.lyric-line.next{font-size:clamp(14px,3.1cqw,46px);color:#ffffffb0;margin-top:.25em;text-shadow:0 0 3px #000,0 2px 6px #000c}.lyric-line .w{position:relative;display:inline-block;white-space:pre;color:#fff;text-shadow:0 0 3px #000,0 2px 6px #000c}.lyric-line .w::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:pre;color:var(--highlight);text-shadow:0 0 3px #000,0 2px 6px #000c;clip-path:inset(0 calc(100% - var(--p,0)*100%) 0 0)}.lyrics-bar{display:flex;gap:8px 16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--preview-text)}.lyrics-bar button{padding:4px 10px;font-size:13px;background:#ffffff0d;border-color:#ffffff26;color:#fff}.lyrics-sync{display:flex;align-items:center;gap:6px}.lyrics-sync output{min-width:72px;color:#fff}#lyricsToggle[aria-pressed=true]{border-color:var(--highlight);color:var(--highlight)}.tv-foot:empty{display:none}.tv-foot{text-align:center;color:var(--preview-text);font-size:14px;padding:12px}#screen.answer #tvTitle{font-size:clamp(36px,min(5.5vw,9dvh),88px);margin:0 0 6px}#screen.answer #tvSub{font-size:clamp(20px,3.4dvh,34px);margin:0}#screen.answer{padding-top:0;justify-content:flex-start}#screen.answer #tvTag{font-size:14px;margin-bottom:10px}[hidden]{display:none!important}@media(max-width:600px){.tv-size{font-size:12px}.tv-tools{gap:8px}.tv-levels{font-size:14px;gap:8px}.tv-levels span{padding:10px}.tv-head{font-size:13px;gap:10px}} </style></head><body>
<header class="tv-head"><span id="tvProgress">전주 듣고 노래 맞히기</span><div class="tv-tools"><button id="lyricsToggle" aria-pressed="false" title="정답 화면 가사 ( L 키 )">가사 끔</button><div class="tv-size" role="group" aria-label="정답 영상 크기">영상 크기 <button id="sizeDown" aria-label="영상 작게" title="영상 작게 ( - 키 )">−</button><output id="sizeValue">100%</output><button id="sizeUp" aria-label="영상 크게" title="영상 크게 ( + 키 )">+</button></div><button id="fullscreen">전체 화면</button></div></header>
<main id="screen"><span id="tvTag">READY TO PLAY</span><div class="record tv-record" id="tvRecord" aria-hidden="true"><div>♪</div></div><h1 id="tvTitle">전주 듣고 노래 맞히기</h1><p id="tvSub">곧 시작합니다.</p><div class="tv-levels" id="tvLevels"><span>상 · 0.5초</span><span>중 · 1초</span><span id="tvEasy">하 · 3초 이상</span></div><div id="videoWrap" hidden><div class="video-stage" id="videoStage"><div id="answerPlayer"></div><div class="lyrics" id="lyrics" hidden><p class="lyric-line now" id="lyricNow"></p><p class="lyric-line next" id="lyricNext"></p></div></div><div class="lyrics-bar" id="lyricsBar" hidden><span id="lyricsStatus" role="status"></span><span class="lyrics-sync" id="lyricsSync" hidden><button id="lyricsEarlier" title="가사가 늦게 나올 때 ( [ 키 )">◀ 가사 빠르게</button><output id="lyricsOffset">싱크 0.0초</output><button id="lyricsLater" title="가사가 먼저 나올 때 ( ] 키 )">가사 느리게 ▶</button><button id="lyricsHere" title="가수가 화면의 첫 줄을 부르기 시작할 때 누르세요 ( S 키 )">지금 이 줄!</button></span><small>가사 출처 <a href="https://lrclib.net" target="_blank" rel="noopener noreferrer">LRCLIB</a></small></div><a id="externalVideo" hidden target="_blank" rel="noopener noreferrer">유튜브에서 열기</a></div></main><footer class="tv-foot" id="tvFooter" role="status"></footer>
<script type="module" src="tv.mjs"></script></body></html>
